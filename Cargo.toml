[package]
name         = "luz"
version      = "0.0.1"
edition      = "2021"
rust-version = "1.77"
description  = "Warm your screen at night, from the tray, like f.lux"
authors      = ["kidchenko <kidchenko@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/kidchenko/luz"

[[bin]]
name = "luz"
path = "src/main.rs"

[dependencies]
# f.lux's shortcuts (see hotkeys.rs). Same family as tray-icon and tao.
global-hotkey = "0.9"
# Already in the tree via tray-icon; decodes the menu's glyphs (src/art.rs).
png        = "0.18"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tao        = "0.37"
tray-icon  = "0.26"

# ---------------------------------------------------------------------------
# Windows
# ---------------------------------------------------------------------------
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"

[target.'cfg(windows)'.dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_ColorSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# ---------------------------------------------------------------------------
# macOS
# ---------------------------------------------------------------------------
# The gamma tables are plain CoreGraphics FFI (see gamma.rs). `libc` is for
# localtime_r. objc2 is already in the tree via tao and tray-icon;
# ServiceManagement is for run-at-login (autostart.rs), AppKit for spotting
# f.lux (rival.rs) and withdrawing tao's launch activation (main.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc                     = "0.2"
objc2                    = "0.6"
objc2-app-kit            = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation         = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSRunLoop", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
