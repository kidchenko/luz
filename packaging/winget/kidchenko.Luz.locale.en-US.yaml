ShortDescription: Warm your screen at night, from the tray, like f.lux
Description: |-
  A sun in the notification area that turns your screen's colour warmer after
  sunset and back to daylight in the morning, like f.lux.

  Sunrise and sunset are worked out for where you are, guessed from your time
  zone, so there is no location prompt and nothing goes over the network.
  Bedtime mode goes warmer still before you sleep. Pause it for an hour or
  until morning, or nudge it warmer, cooler or dimmer, with f.lux's own
  keyboard shortcuts. Colours go down to 1200 K, and every change fades.
